apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ca
  namespace: ombud1-net
  annotations:
    fluxcd.io/automated: "false"
spec:
  interval: 1m
  releaseName: ca
  chart:
    spec:
      interval: 1m
      sourceRef:
        kind: GitRepository
        name: flux-local
        namespace: flux-local
      chart: platforms/hyperledger-fabric/charts/fabric-ca-server   
  values:
    global:
      serviceAccountName: vault-auth
      cluster:
        provider: minikube
        cloudNativeServices: false
        kubernetesUrl: https://77.42.86.155:18443
      vault:
        type: hashicorp
        network: fabric
        address: http://192.168.49.4:8200
        authPath: localombud1
        secretEngine: secretsv2
        secretPrefix: "data/localombud1"
        role: vault-role
        tls: false
      proxy:
        provider: haproxy
        externalUrlSuffix: pm3fraktal.se
        externalIp: 77.42.86.155

    storage:
      enabled: True
      size: 512Mi
      reclaimPolicy: "Delete"
      volumeBindingMode: Immediate
      allowedTopologies:
        enabled: false
      nameOverride: ombud1-bevel-storageclass

    image:
      alpineUtils: ghcr.io/hyperledger/bevel-alpine:latest
      ca: ghcr.io/hyperledger/bevel-fabric-ca:latest
      pullSecret: ""

    server:
      removeCertsOnDelete: true
      tlsStatus: true
      adminUsername: ombud1-admin
      adminPassword: ombud1-adminpw
      subject: "/C=SE/ST=YourState/L=YourCity/O=Ombud1/CN=ca.ombud1-net"
      clusterIpPort: 7054

